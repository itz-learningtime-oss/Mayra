name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install APKTool 3.0.3 and Android Build Tools
        run: |
          sudo apt-get update
          # Install APKTool 3.0.3 (matches decompile version, bundles aapt2)
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version
          # Install android-sdk build-tools for zipalign + apksigner
          sudo apt-get install -y android-sdk-platform-tools android-sdk-build-tools
          echo "ANDROID_HOME=/usr" >> $GITHUB_ENV
          # Find the build-tools version
          BT_DIR=$(ls /usr/lib/android-sdk/build-tools/ | sort -V | tail -1)
          echo "BUILD_TOOLS_VERSION=$BT_DIR" >> $GITHUB_ENV
          echo "Build tools version: $BT_DIR"

      - name: Build unsigned APK
        run: |
          java -jar apktool.jar build -o output-unsigned.apk

      - name: Generate signing key (PKCS8 + PEM cert)
        run: |
          # Generate a private key in PKCS#8 DER format (apksigner requires DER, not PEM text)
          openssl genrsa -out key.pem 2048
          openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out key.pk8 -nocrypt
          # Generate a self-signed certificate
          openssl req -new -x509 -key key.pem -out cert.x509.pem -days 10000 -subj "/CN=MYRA/O=MYRA Dev/C=US"

      - name: Zipalign
        run: |
          /usr/lib/android-sdk/build-tools/${{ env.BUILD_TOOLS_VERSION }}/zipalign -v 4 output-unsigned.apk output-aligned.apk

      - name: Sign APK
        run: |
          /usr/lib/android-sdk/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner sign --key key.pk8 --cert cert.x509.pem output-aligned.apk

      - name: Verify APK
        run: |
          /usr/lib/android-sdk/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify output-aligned.apk
          echo "APK signed and verified successfully!"

      - name: Prepare final APK
        run: |
          mv output-aligned.apk myra-app.apk
          ls -lh myra-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myra-apk
          path: myra-app.apk
          retention-days: 30
