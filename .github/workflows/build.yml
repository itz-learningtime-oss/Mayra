name: Optimized Fast APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Essential Utilities Only
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="10"
          sudo apt-get install -y --no-install-recommends wget zipalign

      - name: Cache APKTool
        id: cache-apktool
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/apktool
            /usr/local/bin/apktool.jar
            ~/.local/share/apktool
          key: ${{ runner.os }}-apktool-v3.0.3

      - name: Download APKTool (if cache miss)
        if: steps.cache-apktool.outputs.cache-hit != 'true'
        run: |
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Build APK with Apktool
        run: |
          apktool b . -o myra_patched_unaligned.apk -q --no-crunch

      - name: Align APK
        run: |
          zipalign -p -f 4 myra_patched_unaligned.apk myra_patched_aligned.apk

      - name: Find Android Build Tools Version
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -1)
          echo "BUILD_TOOLS_VERSION=$BT" >> $GITHUB_ENV
          echo "Detected build tools version: $BT"

      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingKey.jks
          /usr/local/lib/android/sdk/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner sign \
            --ks signingKey.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out myra_patched.apk \
            myra_patched_aligned.apk
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK
        run: |
          /usr/local/lib/android/sdk/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify myra_patched.apk
          echo "APK signed and verified successfully!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myra-patched-apk
          path: myra_patched.apk